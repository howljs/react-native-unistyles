name: Publish fork package

# Publishing is manual so upstream synchronization never releases packages.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Fork package version
        required: true
        type: string
        default: 3.3.0-macos.1
      dry_run:
        description: Build and pack without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@howljs'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test library
        run: |
          bun run --cwd packages/unistyles prepare
          bun run --cwd packages/unistyles precommit

      - name: Prepare fork package manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'packages/unistyles/package.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))

          if (!/^\d+\.\d+\.\d+-macos\.\d+$/.test(process.env.VERSION)) {
              throw new Error(`Invalid fork version: ${process.env.VERSION}`)
          }

          manifest.name = '@howljs/react-native-unistyles'
          manifest.version = process.env.VERSION
          manifest.repository = 'https://github.com/howljs/react-native-unistyles'
          manifest.homepage = 'https://github.com/howljs/react-native-unistyles#readme'
          manifest.bugs = {
              url: 'https://github.com/howljs/react-native-unistyles/issues'
          }
          manifest.publishConfig = {
              access: 'public',
              registry: 'https://npm.pkg.github.com'
          }

          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          fs.copyFileSync('README.md', 'packages/unistyles/README.md')
          NODE

      - name: Dry-run package
        if: ${{ inputs.dry_run }}
        working-directory: packages/unistyles
        run: npm publish --tag macos --dry-run

      - name: Publish package
        if: ${{ !inputs.dry_run }}
        working-directory: packages/unistyles
        run: npm publish --tag macos --access public
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
